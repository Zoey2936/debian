name: build
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: packages
        run: echo "packages=$(jq -n -c '$ARGS.positional | map(rtrimstr("/"))' --args */)" >> $GITHUB_OUTPUT

  build-amd64:
    runs-on: ubuntu-latest
    container: debian:13.7@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    permissions:
      contents: read
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends devscripts
          sed -i "1s/-[^)-]*)/-${{ github.run_number }})/" ${{ matrix.package }}/debian/changelog
          cd ${{ matrix.package }}
          origtargz --unpack
          apt-get build-dep -y ./
          dpkg-buildpackage -b
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: amd64-${{ matrix.package }}
          path: '*.deb'

  build-arm64:
    runs-on: ubuntu-26.04-arm
    container: debian:13.7@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    permissions:
      contents: read
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends devscripts
          sed -i "1s/-[^)-]*)/-${{ github.run_number }})/" ${{ matrix.package }}/debian/changelog
          cd ${{ matrix.package }}
          origtargz --unpack
          apt-get build-dep -y ./
          dpkg-buildpackage -b
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arm64-${{ matrix.package }}
          path: '*.deb'

  deploy:
    runs-on: ubuntu-latest
    container: debian:13.7@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    permissions:
      pages: write
      id-token: write
    needs: [build-amd64, build-arm64]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: debs
          merge-multiple: true
      - name: repo
        env:
          GPG_PRIVKEY: ${{ secrets.GPG_PRIVKEY }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gnupg debsigs reprepro
          printenv GPG_PRIVKEY | gpg --batch --import
          debsigs --sign=origin debs/*.deb
          mkdir conf
          printf 'Codename: trixie\nArchitectures: amd64 arm64\nComponents: main\nSignWith: yes\n' | tee conf/distributions
          reprepro --outdir ./repo includedeb trixie debs/*.deb
          gpg --armor --export | tee repo/zoey2936.asc
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
